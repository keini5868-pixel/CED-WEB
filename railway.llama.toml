# Railway — servicio Ollama / Llama local — SOLO texto (CED-Llama)
#
# En Railway → servicio CED-Llama → Settings → Config-as-code:
#   Config file path: /railway.llama.toml
#
# Root Directory: repo root. Dockerfile: apps/ollama/Dockerfile
#
# VOLUMEN PERSISTENTE (recomendado):
#   Settings → Volumes → Add Volume → Mount path: /data
#   Solo el modelo 13B (~7.4 GB). El 3B de voz vive en CED-Llama-Voice.
#
# RED PRIVADA:
#   - Hostname: ced-llama.railway.internal
#   - OLLAMA_HOST=[::]:11434
#
# Variables en CED-Llama:
#   OLLAMA_MODEL=llama2:13b
#   OLLAMA_NUM_PARALLEL=1
#   OLLAMA_MAX_LOADED_MODELS=1
#
# Variables en API:
#   LLAMA_ENDPOINT=http://ced-llama.railway.internal:11434
#   LLAMA_MODEL=llama2:13b
#   LLAMA_VOICE_ENDPOINT=http://ced-llama-voice.railway.internal:11434
#   LLAMA_VOICE_MODEL=llama3.2:3b
#
# Servicio de voz separado: ver railway.llama-voice.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/ollama/Dockerfile"
watchPatterns = [
  "apps/ollama/**",
  "railway.llama.toml",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
