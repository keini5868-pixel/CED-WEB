# Railway — servicio @ced/api (FastAPI)
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**"]

[deploy]
# Desactivado: Railway healthcheck bloqueaba deploys (Supabase/cold start).
# UptimeRobot o Railway metrics cubren monitoreo post-deploy.
healthcheckPath = ""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
