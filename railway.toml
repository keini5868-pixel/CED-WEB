# Railway — servicio API backend (CED-WEB-PRODUCTION / @ced/api)
#
# Alias de railway.api.toml — Railway lo detecta por defecto si no hay otro config path.
# Recomendado en Settings → Config-as-code: /railway.api.toml
#
# Root Directory: repo root (vacío). Dockerfile: apps/api/Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "railway.toml",
  "railway.api.toml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 240
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
