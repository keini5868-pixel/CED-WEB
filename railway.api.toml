# Railway — servicio API backend (CED-WEB-PRODUCTION / @ced/api)
#
# En Railway → servicio API → Settings → Config-as-code:
#   Config file path: /railway.api.toml
#
# Root Directory: repo root (vacío). Dockerfile: apps/api/Dockerfile
# NO usar railway.web.toml en este servicio.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "railway.toml",
  "railway.api.toml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
